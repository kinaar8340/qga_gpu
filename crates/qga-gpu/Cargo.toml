[package]
name = "qga-gpu"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "../../README.md"
description = "wgpu/Vulkan renderer for QGA. This crate owns the frame."

[features]
default = ["winit"]
winit = ["dep:winit", "dep:pollster"]
headless = ["dep:pollster"]
capture = []
glow = []
# Fiber conversion lives in the consumer (inner_cone geometry::gpu_fiber).
# Do not path-dep a sibling qga_engine checkout.

[dependencies]
glam.workspace = true
bytemuck.workspace = true
wgpu.workspace = true
anyhow.workspace = true
log.workspace = true
pollster = { workspace = true, optional = true }
winit = { workspace = true, optional = true }
